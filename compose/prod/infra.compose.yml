services:
  keycloak:
    image: "quay.io/keycloak/keycloak:26.0.0"
    container_name: "shiftcontrol-keycloak"
    hostname: "keycloak"
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_HOSTNAME: keycloak.shiftcontrol.example.com
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: 'xforwarded'
      PROXY_ADDRESS_FORWARDING: 'true'
    command:
      - start
      - --log-level=INFO
    volumes:
      - keycloak-data:/data
    networks:
      - shiftcontrol
      - traefik-nw
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-nw
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.rule=Host(`keycloak.shiftcontrol.example.com`)
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  postgres:
    image: "postgres:latest"
    container_name: "shiftcontrol-postgres"
    hostname: "postgres"
    environment:
      POSTGRES_USER: "shiftcontrol"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "shiftservice"
    networks:
      - shiftcontrol
    volumes:
      - postgres-data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - shiftcontrol
      - traefik-nw
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-nw
      - traefik.http.routers.pgadmin.entrypoints=websecure
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.shiftcontrol.example.com`)
      - traefik.http.services.pgadmin.loadbalancer.server.port=80

  rabbitmq:
    image: rabbitmq:4-management
    container_name: "rabbitmq"
    hostname: "rabbitmq"
    environment:
      RABBITMQ_DEFAULT_USER: shiftcontrol
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - shiftcontrol
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

networks:
  shiftcontrol:
    external: true
  traefik-nw:
    external: true

volumes:
  postgres-data:
  pgadmin-data:
  rabbitmq-data:
  keycloak-data: