services:
  traefik:
    image: traefik:latest
    container_name: shiftcontrol-prod-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=false

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: shiftcontrol-keycloak
    hostname: keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in compose/prod/.env}
      KC_HOSTNAME: ${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      PROXY_ADDRESS_FORWARDING: "true"
    command:
      - start
      - --import-realm
      - --log-level=INFO
    volumes:
      - ./data/keycloak:/opt/keycloak/data
      - ./config/realm.json:/opt/keycloak/data/import/prod-realm.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.rule=Host(`${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}`)
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  postgres:
    image: postgres:latest
    container_name: shiftcontrol-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiftcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in compose/prod/.env}
      POSTGRES_DB: ${POSTGRES_DB:-shiftservice}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiftcontrol} -d ${POSTGRES_DB:-shiftservice}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

#  pgadmin:
#    image: dpage/pgadmin4:latest
#    container_name: shiftcontrol-pgadmin
#    depends_on:
#      postgres:
#        condition: service_healthy
#    environment:
#      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
#      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in compose/prod/.env}
#    volumes:
#      - ./data/pgadmin:/var/lib/pgadmin
#    labels:
#      - traefik.enable=true
#      - traefik.http.routers.pgadmin.entrypoints=websecure
#      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}`)
#      - traefik.http.routers.pgadmin.tls=true
#      - traefik.http.services.pgadmin.loadbalancer.server.port=80

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shiftcontrol}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in compose/prod/.env}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: shiftcontrol-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  shiftservice:
    image: ghcr.io/pilotwhale-os/shiftcontrol/shiftservice:latest
    container_name: shiftcontrol-shiftservice
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SHIFTCONTROL_DOMAIN: ${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}
      SHIFTCONTROL_KEYCLOAK_DOMAIN: ${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in compose/prod/.env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shiftservice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shiftcontrol}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in compose/prod/.env}
    volumes:
      - ./config/shiftservice.application.yml:/app/application.yml
    labels:
      - traefik.enable=true
      - traefik.http.routers.shiftservice.entrypoints=websecure
      - traefik.http.routers.shiftservice.rule=Host(`${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}`) && PathPrefix(`/shiftservice`)
      - traefik.http.routers.shiftservice.priority=100
      - traefik.http.routers.shiftservice.tls=true
      - traefik.http.services.shiftservice.loadbalancer.server.port=8080

  notificationservice:
    image: ghcr.io/pilotwhale-os/shiftcontrol/notificationservice:latest
    container_name: shiftcontrol-notificationservice
    depends_on:
      shiftservice:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SHIFTCONTROL_DOMAIN: ${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}
      SHIFTCONTROL_KEYCLOAK_DOMAIN: ${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}
      EMPTY: empty
      Jwt__Authority: http://keycloak:8080/realms/prod
      Jwt__Issuers__0: http://keycloak:8080/realms/prod
      SignalR__AllowedOrigins__0: https://${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}
      Jwt__Issuers__1: https://${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}/realms/prod
      Frontend__BaseUrl: https://${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:-shiftcontrol}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in compose/prod/.env}
      Db__ConnectionString: Server=postgres;Port=5432;Database=${NOTIFICATIONSERVICE_POSTGRES_DB:-notificationservice};User Id=${POSTGRES_USER:-shiftcontrol};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in compose/prod/.env};
      Keycloak__ClientSecret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:?Set KEYCLOAK_INTERNAL_CLIENT_SECRET in compose/prod/.env}
      Email__SmtpPassword: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in compose/prod/.env}
    volumes:
      - ./config/notificationservice.appsettings.json:/app/appsettings.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.notificationservice.entrypoints=websecure
      - traefik.http.routers.notificationservice.rule=Host(`${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}`) && PathPrefix(`/notifications`)
      - traefik.http.routers.notificationservice.priority=100
      - traefik.http.routers.notificationservice.tls=true
      - traefik.http.routers.notificationservice.middlewares=notificationservice-strip-prefix
      - traefik.http.middlewares.notificationservice-strip-prefix.stripprefix.prefixes=/notifications
      - traefik.http.services.notificationservice.loadbalancer.server.port=8080

  auditservice:
    image: ghcr.io/pilotwhale-os/shiftcontrol/auditservice:latest
    container_name: shiftcontrol-auditservice
    depends_on:
      shiftservice:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SHIFTCONTROL_DOMAIN: ${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}
      SHIFTCONTROL_KEYCLOAK_DOMAIN: ${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in compose/prod/.env}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shiftcontrol}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in compose/prod/.env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shiftservice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shiftcontrol}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in compose/prod/.env}
    volumes:
      - ./config/auditservice.application.yml:/app/application.yml
    labels:
      - traefik.enable=true
      - traefik.http.routers.auditservice.entrypoints=websecure
      - traefik.http.routers.auditservice.rule=Host(`${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}`) && PathPrefix(`/auditservice`)
      - traefik.http.routers.auditservice.priority=100
      - traefik.http.routers.auditservice.tls=true
      - traefik.http.services.auditservice.loadbalancer.server.port=8089

  trustservice:
    image: ghcr.io/pilotwhale-os/shiftcontrol/trustservice:latest
    container_name: shiftcontrol-trustservice
    depends_on:
      shiftservice:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SHIFTCONTROL_DOMAIN: ${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}
      SHIFTCONTROL_KEYCLOAK_DOMAIN: ${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shiftcontrol}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in compose/prod/.env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shiftservice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shiftcontrol}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in compose/prod/.env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    volumes:
      - ./config/trustservice.application.yml:/app/application.yml

  shiftcontrol-frontend:
    image: ghcr.io/pilotwhale-os/shiftcontrol/dashboard:latest
    container_name: shiftcontrol-dashboard
    environment:
      SHIFTCONTROL_KEYCLOAK_DOMAIN: ${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}
      KEYCLOAK_URL: https://${SHIFTCONTROL_KEYCLOAK_DOMAIN:-keycloak.shiftcontrol.example.com}
      KEYCLOAK_REALM: prod
      KEYCLOAK_CLIENT_ID: frontend
      SHIFTSERVICE_BASE_PATH: https://${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}/shiftservice
      AUDITSERVICE_BASE_PATH: https://${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}/auditservice
      NOTIFICATIONSERVICE_BASE_PATH: https://${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}/notifications
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${SHIFTCONTROL_DOMAIN:-shiftcontrol.example.com}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.priority=1
      - traefik.http.routers.frontend.tls=true
      - traefik.http.services.frontend.loadbalancer.server.port=8080
      # - traefik.http.routers.frontend.middlewares=jwt-auth@file

  # Optional: use a Cloudflare Tunnel instead of publishing ports 80/443 on Traefik.
  # Uncomment this service, set CLOUDFLARE_TUNNEL_TOKEN, and point the tunnel at traefik:80.
