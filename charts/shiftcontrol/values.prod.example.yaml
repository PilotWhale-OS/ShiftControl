global:
  domain: shiftcontrol.site.com
  scheme: https
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  ingress:
    enabled: true
    className: nginx
    tls:
      - hosts:
          - shiftcontrol.site.com
        secretName: shiftcontrol-tls
  oidc:
    baseUrl: https://auth.site.com
    realm: prod
    clientId: shiftcontrol
    issuerUri: https://auth.site.com/realms/prod
    tokenUrl: https://auth.site.com/realms/prod/protocol/openid-connect/token
  internalApiKey: change-me-to-a-long-random-secret
  keycloakInternalClientSecret: ""

postgres:
  auth:
    username: shiftcontrol
    password: change-me
    database: shiftservice
    notificationDatabase: notificationservice
  extraEnv:
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
  livenessProbe:
    tcpSocket:
      port: postgres
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: postgres
    initialDelaySeconds: 5
    periodSeconds: 10
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsUser: 999
    runAsGroup: 999
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

rabbitmq:
  auth:
    username: shiftcontrol
    password: change-me
  livenessProbe:
    tcpSocket:
      port: amqp
    initialDelaySeconds: 20
    periodSeconds: 15
  readinessProbe:
    tcpSocket:
      port: amqp
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

redis:
  livenessProbe:
    tcpSocket:
      port: redis
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: redis
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

