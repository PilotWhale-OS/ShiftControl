notificationIngress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  tls:
    - hosts:
        - shiftcontrol.site.com
      secretName: shiftcontrol-tls

notificationservice:
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  email:
    enableSending: false
    smtpHost: smtp.gmail.com
    smtpPort: 587
    smtpUsername: notifications@example.com
    smtpPassword: change-me
    fromName: ShiftControl Notifications
    fromEmail: noreply@shiftcontrol.site.com
    secureSocketOptions: StartTls
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 512Mi

