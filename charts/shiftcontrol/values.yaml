nameOverride: ""
fullnameOverride: ""

existingSecret: ""

global:
  domain: shiftcontrol.example.com
  scheme: https
  imagePullSecrets: []
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  ingress:
    enabled: true
    className: ""
    annotations: {}
    tls: []
  oidc:
    baseUrl: https://auth.example.com
    realm: prod
    clientId: shiftcontrol
    issuerUri: https://auth.example.com/realms/prod
    tokenUrl: https://auth.example.com/realms/prod/protocol/openid-connect/token
  internalApiKey: ""
  keycloakInternalClientSecret: ""

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    username: shiftcontrol
    password: ""
    database: shiftservice
    notificationDatabase: notificationservice
  service:
    port: 5432
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 8Gi
    storageClass: ""
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsUser: 999
    runAsGroup: 999
  resources: {}

rabbitmq:
  image:
    repository: rabbitmq
    tag: "4-management"
    pullPolicy: IfNotPresent
  auth:
    username: shiftcontrol
    password: ""
  service:
    amqpPort: 5672
    managementPort: 15672
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 8Gi
    storageClass: ""
  resources: {}

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  podSecurityContext: {}
  containerSecurityContext: {}
  resources: {}

shiftservice:
  replicaCount: 1
  image:
    repository: ghcr.io/pilotwhale-os/shiftcontrol/shiftservice
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  liquibaseContexts: prod
  podSecurityContext: {}
  containerSecurityContext: {}
  resources: {}
  extraEnv: []

notificationservice:
  replicaCount: 1
  image:
    repository: ghcr.io/pilotwhale-os/shiftcontrol/notificationservice
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  email:
    enableSending: false
    smtpHost: smtp.gmail.com
    smtpPort: 587
    smtpUsername: ""
    smtpPassword: ""
    fromName: ShiftControl Notifications
    fromEmail: noreply@example.com
    secureSocketOptions: StartTls
  podSecurityContext: {}
  containerSecurityContext: {}
  resources: {}
  extraEnv: []

auditservice:
  replicaCount: 1
  image:
    repository: ghcr.io/pilotwhale-os/shiftcontrol/auditservice
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8089
  podSecurityContext: {}
  containerSecurityContext: {}
  resources: {}
  extraEnv: []

trustservice:
  replicaCount: 1
  image:
    repository: ghcr.io/pilotwhale-os/shiftcontrol/trustservice
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  podSecurityContext: {}
  containerSecurityContext: {}
  resources: {}
  extraEnv: []

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/pilotwhale-os/shiftcontrol/dashboard
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  podSecurityContext: {}
  containerSecurityContext: {}
  resources: {}
  extraEnv: []

notificationIngress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  host: ""
  path: /notifications(/|$)(.*)
  pathType: ImplementationSpecific
  tls: []

pgadmin:
  enabled: false
  image:
    repository: dpage/pgadmin4
    tag: latest
    pullPolicy: IfNotPresent
  credentials:
    email: admin@example.com
    password: ""
  service:
    port: 80
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    pathType: Prefix
    tls: []
  podSecurityContext: {}
  containerSecurityContext: {}
  resources: {}
