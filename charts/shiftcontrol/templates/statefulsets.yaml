apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "shiftcontrol.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "postgres") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "shiftcontrol.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shiftcontrol.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "shiftcontrol.podSecurityContext" (dict "root" . "componentSecurityContext" .Values.postgres.podSecurityContext) | fromYaml) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          {{- with (include "shiftcontrol.containerSecurityContext" (dict "root" . "componentSecurityContext" .Values.postgres.containerSecurityContext) | fromYaml) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: postgres-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: postgres-password
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
          {{- with .Values.postgres.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port }}
          {{- with (include "shiftcontrol.probeSpec" .Values.postgres.livenessProbe | fromYaml) }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "shiftcontrol.probeSpec" .Values.postgres.readinessProbe | fromYaml) }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: 01-init.sql
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "postgres-init") }}
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "postgres") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
