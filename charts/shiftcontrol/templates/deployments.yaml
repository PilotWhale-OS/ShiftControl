          {{- with (include "shiftcontrol.containerSecurityContext" (dict "root" . "componentSecurityContext" .Values.notificationservice.containerSecurityContext) | fromYaml) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: EMPTY
              value: empty
            - name: SHIFTCONTROL_DOMAIN
              value: {{ .Values.global.domain | quote }}
            - name: SHIFTCONTROL_OIDC_ISSUER_URI
              value: {{ .Values.global.oidc.issuerUri | quote }}
            - name: SHIFTCONTROL_OIDC_TOKEN_URL
              value: {{ .Values.global.oidc.tokenUrl | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ include "shiftcontrol.publicBaseUrl" . | quote }}
            - name: Email__EnableSending
              value: {{ .Values.notificationservice.email.enableSending | quote }}
            - name: Email__SmtpHost
              value: {{ .Values.notificationservice.email.smtpHost | quote }}
            - name: Email__SmtpPort
              value: {{ .Values.notificationservice.email.smtpPort | quote }}
            - name: Email__FromName
              value: {{ .Values.notificationservice.email.fromName | quote }}
            - name: Email__FromEmail
              value: {{ .Values.notificationservice.email.fromEmail | quote }}
            - name: Email__SecureSocketOptions
              value: {{ .Values.notificationservice.email.secureSocketOptions | quote }}
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: rabbitmq-password
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: postgres-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: postgres-password
            - name: NOTIFICATIONSERVICE_POSTGRES_DB
              value: {{ .Values.postgres.auth.notificationDatabase | quote }}
            - name: SHIFTCONTROL_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: internal-api-key
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: oidc-client-secret
            - name: Email__SmtpPassword
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: smtp-password
            - name: Email__SmtpUsername
              valueFrom:
                secretKeyRef:
                  name: {{ include "shiftcontrol.secretName" . }}
                  key: smtp-username
            - name: Jwt__Authority
              value: {{ .Values.global.oidc.issuerUri | quote }}
            - name: Jwt__Issuers__0
              value: {{ .Values.global.oidc.issuerUri | quote }}
            - name: SignalR__AllowedOrigins__0
              value: "$(PUBLIC_BASE_URL)"
            - name: Frontend__BaseUrl
              value: "$(PUBLIC_BASE_URL)"
            - name: RabbitMQ__HostName
              value: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "rabbitmq") | quote }}
            - name: RabbitMQ__UserName
              value: "$(RABBITMQ_DEFAULT_USER)"
            - name: RabbitMQ__Password
              value: "$(RABBITMQ_DEFAULT_PASS)"
            - name: Db__ConnectionString
              value: "Server={{ include "shiftcontrol.componentFullname" (dict "root" . "component" "postgres") }};Port={{ .Values.postgres.service.port }};Database=$(NOTIFICATIONSERVICE_POSTGRES_DB);User Id=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"
            - name: Shiftservice__BaseUrl
              value: "http://{{ include "shiftcontrol.componentFullname" (dict "root" . "component" "shiftservice") }}:{{ .Values.shiftservice.service.port }}/"
            - name: Shiftservice__ApiKey
              value: "$(SHIFTCONTROL_INTERNAL_API_KEY)"
            - name: OAuth2__Client__TokenUrl
              value: {{ .Values.global.oidc.tokenUrl | quote }}
            - name: OAuth2__Client__ClientSecret
              value: "$(KEYCLOAK_INTERNAL_CLIENT_SECRET)"
          {{- with .Values.notificationservice.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.notificationservice.service.port }}
          {{- with (include "shiftcontrol.probeSpec" .Values.notificationservice.livenessProbe | fromYaml) }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "shiftcontrol.probeSpec" .Values.notificationservice.readinessProbe | fromYaml) }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.json
              subPath: appsettings.json
          resources:
            {{- toYaml .Values.notificationservice.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "notificationservice-config") }}
