      {{- include "shiftcontrol.componentSelectorLabels" (dict "root" . "component" "shiftservice") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shiftcontrol.componentSelectorLabels" (dict "root" . "component" "shiftservice") | nindent 8 }}
