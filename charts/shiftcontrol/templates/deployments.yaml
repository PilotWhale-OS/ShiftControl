            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
          resources:
            {{- toYaml .Values.pgadmin.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.pgadmin.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "pgadmin") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
