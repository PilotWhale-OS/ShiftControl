apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "redis") }}
  labels:
    {{- include "shiftcontrol.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shiftcontrol.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shiftcontrol.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "shiftcontrol.podSecurityContext" (dict "root" . "componentSecurityContext" .Values.redis.podSecurityContext) | fromYaml) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- with (include "shiftcontrol.containerSecurityContext" (dict "root" . "componentSecurityContext" .Values.redis.containerSecurityContext) | fromYaml) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
          {{- with (include "shiftcontrol.probeSpec" .Values.redis.livenessProbe | fromYaml) }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "shiftcontrol.probeSpec" .Values.redis.readinessProbe | fromYaml) }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
