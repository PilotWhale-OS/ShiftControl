          {{- with (include "shiftcontrol.probeSpec" .Values.shiftservice.readinessProbe | fromYaml) }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/application.yml
              subPath: application.yml
          resources:
            {{- toYaml .Values.shiftservice.resources | nindent 12 }}
