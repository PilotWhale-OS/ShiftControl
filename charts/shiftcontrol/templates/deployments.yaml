      {{- with (include "shiftcontrol.podSecurityContext" (dict "root" . "componentSecurityContext" .Values.shiftservice.podSecurityContext) | fromYaml) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
