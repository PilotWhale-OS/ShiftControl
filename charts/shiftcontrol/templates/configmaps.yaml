---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "postgres-init") }}
  labels:
    {{- include "shiftcontrol.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
data:
  01-init.sql: |
    {{- if ne .Values.postgres.auth.database .Values.postgres.auth.notificationDatabase }}
    CREATE DATABASE "{{ .Values.postgres.auth.notificationDatabase }}";
    {{- else }}
    SELECT 1;
    {{- end }}
