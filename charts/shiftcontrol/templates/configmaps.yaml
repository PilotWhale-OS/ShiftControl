apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shiftcontrol.componentFullname" (dict "root" . "component" "shiftservice-config") }}
  labels:
    {{- include "shiftcontrol.componentLabels" (dict "root" . "component" "shiftservice") | nindent 4 }}
data:
  application.yml: |
{{ .Files.Get "files/config/shiftservice.application.yml" | indent 4 }}
